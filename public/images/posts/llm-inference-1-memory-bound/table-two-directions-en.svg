<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 242"><style>text { font-family: 'Apple SD Gothic Neo','Pretendard','Noto Sans KR',system-ui,sans-serif; }</style>
<rect x="0.5" y="0.5" width="839" height="241" rx="12" fill="#f7f8fa" stroke="#e5e7eb"/>
<text x="30" y="44" fill="#282728" font-size="16" font-weight="700">One wall, two directions</text>
<rect x="30" y="70" width="780" height="44" fill="#eef1f5"/>
<text x="44" y="97.0" fill="#282728" font-size="13" font-weight="700" text-anchor="start">Direction</text>
<text x="184" y="97.0" fill="#282728" font-size="13" font-weight="700" text-anchor="start">Example</text>
<text x="364" y="97.0" fill="#282728" font-size="13" font-weight="700" text-anchor="start">How</text>
<text x="574" y="97.0" fill="#282728" font-size="13" font-weight="700" text-anchor="start">Cost</text>
<line x1="30" y1="114" x2="810" y2="114" stroke="#e5e7eb"/>
<text x="44" y="141.0" fill="#282728" font-size="13" font-weight="400" text-anchor="start">Grow compute</text>
<text x="184" y="134.0" fill="#282728" font-size="12" font-weight="400" text-anchor="start">New general-purpose</text>
<text x="184" y="150.0" fill="#282728" font-size="12" font-weight="400" text-anchor="start">GPU generations</text>
<text x="364" y="134.0" fill="#282728" font-size="12" font-weight="400" text-anchor="start">Raise FLOPS, and raise</text>
<text x="364" y="150.0" fill="#282728" font-size="12" font-weight="400" text-anchor="start">HBM bandwidth with it</text>
<text x="574" y="134.0" fill="#282728" font-size="12" font-weight="400" text-anchor="start">Decode only speeds up as</text>
<text x="574" y="150.0" fill="#282728" font-size="12" font-weight="400" text-anchor="start">much as bandwidth does</text>
<line x1="30" y1="158" x2="810" y2="158" stroke="#e5e7eb"/>
<text x="44" y="178.0" fill="#282728" font-size="12" font-weight="400" text-anchor="start">Bring memory</text>
<text x="44" y="194.0" fill="#282728" font-size="12" font-weight="400" text-anchor="start">onto the chip</text>
<text x="184" y="185.0" fill="#282728" font-size="13" font-weight="400" text-anchor="start">Groq LPU</text>
<text x="364" y="178.0" fill="#282728" font-size="12" font-weight="400" text-anchor="start">Keep all weights in</text>
<text x="364" y="194.0" fill="#282728" font-size="12" font-weight="400" text-anchor="start">on-chip SRAM</text>
<text x="574" y="178.0" fill="#282728" font-size="12" font-weight="400" text-anchor="start">Little SRAM per chip, so large</text>
<text x="574" y="194.0" fill="#282728" font-size="12" font-weight="400" text-anchor="start">models need many chips</text>
</svg>