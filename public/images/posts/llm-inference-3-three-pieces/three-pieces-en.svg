<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520">
  <style>
    text { font-family: 'Apple SD Gothic Neo', 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="519" rx="12" fill="#f7f8fa" stroke="#e5e7eb"/>

  <text x="30" y="40" fill="#282728" font-size="16" font-weight="700">Three pieces one request passes through</text>
  <text x="30" y="60" fill="#6b7280" font-size="11">Four NVIDIA announcements (Rubin CPX, Groq 3 LPX, BlueField-4, Dynamo) on one page. Real deployments vary by configuration</text>

  <!-- prefill -->
  <rect x="30" y="110" width="200" height="150" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="130" y="138" fill="#92400e" font-size="12" font-weight="700" text-anchor="middle">prefill: compute</text>
  <text x="130" y="164" fill="#282728" font-size="13" font-weight="700" text-anchor="middle">Rubin CPX</text>
  <text x="130" y="190" fill="#282728" font-size="11" text-anchor="middle">Processes the whole</text>
  <text x="130" y="206" fill="#282728" font-size="11" text-anchor="middle">prompt at once</text>
  <text x="130" y="236" fill="#6b7280" font-size="10" text-anchor="middle">128GB GDDR7 in place of HBM</text>

  <!-- arrow prefill -> decode -->
  <line x1="232" y1="185" x2="290" y2="185" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="261" y="174" fill="#6b7280" font-size="10" text-anchor="middle">KV handoff</text>
  <text x="261" y="203" fill="#6b7280" font-size="10" text-anchor="middle">per turn</text>

  <!-- decode frame -->
  <rect x="296" y="84" width="554" height="210" rx="12" fill="#ffffff" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="312" y="104" fill="#6b7280" font-size="11" font-weight="600">decode: one round trip per layer for every token</text>

  <!-- attention -->
  <rect x="312" y="118" width="220" height="160" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="422" y="146" fill="#166534" font-size="12" font-weight="700" text-anchor="middle">attention: capacity</text>
  <text x="422" y="172" fill="#282728" font-size="13" font-weight="700" text-anchor="middle">Vera Rubin NVL72</text>
  <text x="422" y="198" fill="#282728" font-size="11" text-anchor="middle">Reads the per-user</text>
  <text x="422" y="214" fill="#282728" font-size="11" text-anchor="middle">KV cache</text>
  <text x="422" y="244" fill="#6b7280" font-size="10" text-anchor="middle">288GB HBM per GPU</text>

  <!-- FFN -->
  <rect x="614" y="118" width="220" height="160" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
  <text x="724" y="146" fill="#075985" font-size="12" font-weight="700" text-anchor="middle">FFN: bandwidth</text>
  <text x="724" y="172" fill="#282728" font-size="13" font-weight="700" text-anchor="middle">Groq 3 LPX</text>
  <text x="724" y="198" fill="#282728" font-size="11" text-anchor="middle">Reads the weights</text>
  <text x="724" y="214" fill="#282728" font-size="11" text-anchor="middle">everyone shares</text>
  <text x="724" y="244" fill="#6b7280" font-size="10" text-anchor="middle">500MB SRAM, 150 TB/s per chip</text>
  <text x="724" y="260" fill="#6b7280" font-size="10" text-anchor="middle">128GB per rack (256 chips)</text>

  <!-- attention <-> FFN -->
  <line x1="536" y1="182" x2="610" y2="182" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="610" y1="212" x2="536" y2="212" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="573" y="172" fill="#6b7280" font-size="10" text-anchor="middle">vector</text>
  <text x="573" y="232" fill="#6b7280" font-size="10" text-anchor="middle">every layer</text>

  <!-- storage -->
  <line x1="400" y1="280" x2="400" y2="352" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="444" y1="352" x2="444" y2="280" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="392" y="322" fill="#6b7280" font-size="10" text-anchor="end">KV not needed now</text>
  <text x="452" y="322" fill="#6b7280" font-size="10">back for next turn</text>

  <rect x="312" y="356" width="220" height="92" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="6,3"/>
  <text x="422" y="382" fill="#166534" font-size="12" font-weight="700" text-anchor="middle">storage: capacity</text>
  <text x="422" y="406" fill="#282728" font-size="13" font-weight="700" text-anchor="middle">BlueField-4 storage tier</text>
  <text x="422" y="430" fill="#282728" font-size="11" text-anchor="middle">Keeps KV outside the GPU</text>

  <!-- Dynamo bar -->
  <rect x="30" y="466" width="820" height="32" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
  <text x="440" y="487" fill="#282728" font-size="11" text-anchor="middle">Dynamo (software): decides which chip gets each request and where the KV cache moves</text>

  <!-- legend -->
  <rect x="614" y="372" width="14" height="14" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="636" y="384" fill="#282728" font-size="11">compute-bound</text>
  <rect x="614" y="396" width="14" height="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="636" y="408" fill="#282728" font-size="11">bandwidth-bound</text>
  <rect x="614" y="420" width="14" height="14" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="636" y="432" fill="#282728" font-size="11">capacity-bound</text>
</svg>
