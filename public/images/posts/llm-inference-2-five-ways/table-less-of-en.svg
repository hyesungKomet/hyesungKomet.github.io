<text x="44" y="223.0" fill="#282728" font-size="13" font-weight="400" text-anchor="start">PagedAttention</text>
<text x="214" y="223.0" fill="#282728" font-size="13" font-weight="400" text-anchor="start">Reserving memory that never gets used</text>
