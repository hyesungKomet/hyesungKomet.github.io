<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400">
  <style>
    text { font-family: 'Apple SD Gothic Neo', 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif; }
  </style>

  <rect x="0.5" y="0.5" width="879" height="399" rx="12" fill="#f7f8fa" stroke="#e5e7eb"/>

  <text x="30" y="40" fill="#282728" font-size="16" font-weight="700">How many 100K-token users fit on 8 GPUs</text>
  <text x="30" y="60" fill="#6b7280" font-size="11">Llama 3.1 70B, FP16, 8 × H100 (640GB). Bar length is proportional to size</text>

  <!-- Row 1: MHA -->
  <text x="30" y="122" fill="#282728" font-size="13" font-weight="600">MHA</text>
  <text x="30" y="139" fill="#6b7280" font-size="11">64 KV heads</text>
  <rect x="150" y="105" width="153" height="44" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="226.5" y="132" fill="#282728" font-size="11" font-weight="600" text-anchor="middle">weights 140GB</text>
  <rect x="303" y="105" width="287" height="44" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="446.5" y="132" fill="#282728" font-size="11" font-weight="600" text-anchor="middle">1 user ≈ 262GB</text>
  <rect x="590" y="105" width="260" height="44" fill="#ffffff" stroke="#e11d48" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="720" y="125" fill="#e11d48" font-size="11" font-weight="600" text-anchor="middle">≈ 238GB left</text>
  <text x="720" y="140" fill="#6b7280" font-size="10" text-anchor="middle">not enough for a second user</text>
  <text x="850" y="170" fill="#282728" font-size="13" font-weight="700" text-anchor="end">→ 1 user</text>

  <!-- Row 2: GQA -->
  <text x="30" y="232" fill="#282728" font-size="13" font-weight="600">GQA</text>
  <text x="30" y="249" fill="#6b7280" font-size="11">8 KV heads</text>
  <rect x="150" y="215" width="153" height="44" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="226.5" y="242" fill="#282728" font-size="11" font-weight="600" text-anchor="middle">weights 140GB</text>
  <g fill="#e0f2fe" stroke="#0284c7" stroke-width="1">
    <rect x="303.0" y="215" width="36.1" height="44"/><rect x="339.1" y="215" width="36.1" height="44"/>
    <rect x="375.2" y="215" width="36.1" height="44"/><rect x="411.3" y="215" width="36.1" height="44"/>
    <rect x="447.4" y="215" width="36.1" height="44"/><rect x="483.5" y="215" width="36.1" height="44"/>
    <rect x="519.6" y="215" width="36.1" height="44"/><rect x="555.7" y="215" width="36.1" height="44"/>
    <rect x="591.8" y="215" width="36.1" height="44"/><rect x="627.9" y="215" width="36.1" height="44"/>
    <rect x="664.0" y="215" width="36.1" height="44"/><rect x="700.1" y="215" width="36.1" height="44"/>
    <rect x="736.2" y="215" width="36.1" height="44"/><rect x="772.3" y="215" width="36.1" height="44"/>
    <rect x="808.4" y="215" width="36.1" height="44"/>
  </g>
  <g fill="#282728" font-size="10" text-anchor="middle">
    <text x="321.0" y="241">1</text><text x="357.1" y="241">2</text><text x="393.2" y="241">3</text>
    <text x="429.3" y="241">4</text><text x="465.4" y="241">5</text><text x="501.5" y="241">6</text>
    <text x="537.6" y="241">7</text><text x="573.7" y="241">8</text><text x="609.8" y="241">9</text>
    <text x="645.9" y="241">10</text><text x="682.0" y="241">11</text><text x="718.1" y="241">12</text>
    <text x="754.2" y="241">13</text><text x="790.3" y="241">14</text><text x="826.4" y="241">15</text>
  </g>
  <!-- bracket for one user -->
  <line x1="303" y1="205" x2="339" y2="205" stroke="#0284c7" stroke-width="1.2"/>
  <line x1="303" y1="200" x2="303" y2="210" stroke="#0284c7" stroke-width="1.2"/>
  <line x1="339" y1="200" x2="339" y2="210" stroke="#0284c7" stroke-width="1.2"/>
  <text x="345" y="200" fill="#0284c7" font-size="10" font-weight="600">1 user ≈ 33GB</text>
  <text x="850" y="280" fill="#006cac" font-size="13" font-weight="700" text-anchor="end">→ 15 users</text>

  <!-- axis -->
  <line x1="150" y1="300" x2="850" y2="300" stroke="#6b7280" stroke-width="1"/>
  <line x1="150" y1="295" x2="150" y2="305" stroke="#6b7280" stroke-width="1"/>
  <line x1="303" y1="295" x2="303" y2="305" stroke="#6b7280" stroke-width="1"/>
  <line x1="850" y1="295" x2="850" y2="305" stroke="#6b7280" stroke-width="1"/>
  <text x="150" y="320" fill="#6b7280" font-size="10" text-anchor="middle">0</text>
  <text x="303" y="320" fill="#6b7280" font-size="10" text-anchor="middle">140GB</text>
  <text x="850" y="320" fill="#6b7280" font-size="10" text-anchor="middle">640GB</text>

  <!-- legend -->
  <rect x="30" y="356" width="16" height="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="54" y="369" fill="#282728" font-size="11">Weights: shared by everyone</text>
  <rect x="230" y="356" width="16" height="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="254" y="369" fill="#282728" font-size="11">KV cache: one per user</text>
  <text x="850" y="369" fill="#6b7280" font-size="10" text-anchor="end">KV per token: MHA ≈ 2.6MB, GQA ≈ 0.33MB</text>
</svg>
